#
# Cross-compile the RV64 (musl, small-icu) Node.js guest in CI — the build needs
# Docker, which GitHub runners have. Produces runners/riscv/images/node and uploads it to the
# v0.1.0 release, where the catalog `node` recipe sources it. Manual trigger:
#   gh workflow run build-node.yml -R userland-run/nano
# It is a long build (musl cross-toolchain + Node from source, ~1-2h).
name: build-node

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload runners/riscv/images/node to"
        default: "v0.1.0"

permissions:
  contents: write   # upload runners/riscv/images/node to the release

jobs:
  build-node:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # well under the 6h cap; the cross-compile is slow
    steps:
      - uses: actions/checkout@v4

      # build.sh does the Docker cross-compile (Dockerfile pins node v25.4.0 +
      # --with-intl=small-icu) and extracts the static ELF to runners/riscv/images/node.
      # Build via buildx with the GitHub Actions layer cache. The Dockerfile's
      # slow, deterministic stages — the GCC riscv64 cross-toolchain (musl-cross-
      # make, ~1.5-2h) and the linux headers — are cached, so re-runs and future
      # node builds reuse them and only recompile Node (~30-60 min vs ~3-4h cold).
      - uses: docker/setup-buildx-action@v3
      - name: Cross-compile node (RV64 / musl / small-icu), cached toolchain
        uses: docker/build-push-action@v6
        with:
          context: build/node-riscv
          file: build/node-riscv/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Final stage is `FROM scratch; COPY /node` → export it to ./node-out/node.
          outputs: type=local,dest=node-out

      - name: Stage + inspect the artifact
        run: |
          mkdir -p runners/riscv/images && cp node-out/node runners/riscv/images/node
          file runners/riscv/images/node && ls -lh runners/riscv/images/node

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.release_tag }}"
          gh release upload "$tag" runners/riscv/images/node -R "${{ github.repository }}" --clobber
          echo "uploaded runners/riscv/images/node → release $tag"
