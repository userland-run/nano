[package]
name = "nanovm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# `trace` is on by default so `node test/run.mjs --trace` keeps working on the
# dev builds (make build / build-minimal). Only the lean release artifact
# `nano.min.wasm` (make build-min, --no-default-features) drops it.
default = ["demo", "trace"]
busybox = []  # Embed images/busybox RISC-V ELF into WASM data section (~1MB)
node = []     # Embed images/node RISC-V ELF into WASM data section (~52MB)
devenv = []   # Embed build/devenv.tar.gz into WASM data section
demo = ["busybox", "node", "devenv"]  # All bundled: full demo
trace = []    # Emit a debug_log(0x0A | nr) event on every syscall (conformance coverage)

[dependencies]
# Terminal model parser (Console). default-features=false → no_std, no heap
# (OSC params use a fixed-size ArrayVec, so no global allocator is required).
vte = { version = "0.15", default-features = false }

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
