[package]
name = "nanovm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["demo"]
busybox = []  # Embed images/busybox RISC-V ELF into WASM data section (~1MB)
node = []     # Embed images/node RISC-V ELF into WASM data section (~52MB)
devenv = []   # Embed build/devenv.tar.gz into WASM data section
demo = ["busybox", "node", "devenv"]  # All bundled: full demo

[dependencies]

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
