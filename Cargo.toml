[package]
name = "nanovm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libm = "0.2"

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

# Release: fat LTO + CGU=1 reconstructs the monolithic interpreter from paged source.
# Page functions with #[inline(always)] are fused back into exec() → one 660KB WASM function.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
