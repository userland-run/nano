[package]
name = "nanovm"
version = "0.2.0"
edition = "2021"

[lib]
path = "runners/riscv/src/lib.rs"
# `rlib` is added only so `cargo test`/`cargo nextest` can build a host test
# harness; the shipped wasm artifact is still the `cdylib`, byte-for-byte.
crate-type = ["cdylib", "rlib"]

[features]
# Default is now the SLIM runtime — node + devenv are distributed through the
# catalog (installed into the guest VFS on demand), so they are NOT embedded by
# default. `trace` stays on for dev convenience (`node test/run.mjs --trace`).
# The full all-in-one bundle is an explicit opt-in: `--features demo` (make build-full).
default = ["trace"]
busybox = []  # Embed images/busybox RISC-V ELF into WASM data section (~1MB) — terminal instant boot
node = []     # Embed images/node RISC-V ELF (~52MB) — legacy; prefer the catalog `node` recipe
devenv = []   # Embed build/devenv.tar.gz — legacy; prefer the catalog typescript/eslint recipes
demo = ["busybox", "node", "devenv"]  # All bundled: the legacy offline all-in-one (make build-full)
trace = []    # Emit a debug_log(0x0A | nr) event on every syscall (conformance coverage)
memcheck = []  # TEMP diagnostic: log OOB/truncating guest accesses (mem.rs dbg_check)

[dependencies]
# Terminal model parser (Console). default-features=false → no_std, no heap
# (OSC params use a fixed-size ArrayVec, so no global allocator is required).
vte = { version = "0.15", default-features = false }

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
